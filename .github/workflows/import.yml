# Directory import worker. Started from /ops/import (workflow_dispatch through the GitHub API) or by
# hand from the Actions tab. Runs up to ~5.5 hours, then starts a fresh job if work is left.
name: Import worker

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Import run id (empty = next queued run)
        required: false
        default: ''
      max_minutes:
        description: Stop after this many minutes
        required: false
        default: '330'

concurrency:
  group: import-worker
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Headless Chromium for the worker's own browser: the fallback for pages that need JavaScript and
      # the render step for sites the HTTP crawler could not read. Cached by the playwright-core version.
      - id: pw
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: chromium
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps chromium
      - if: steps.chromium.outputs.cache-hit == 'true'
        run: npx playwright-core install-deps chromium
      - id: work
        run: npm run import:work -- --max-minutes "${{ inputs.max_minutes || '330' }}" ${{ inputs.run_id && format('--run {0}', inputs.run_id) || '' }}
        env:
          DATABASE_URL: ${{ secrets.IMPORT_DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.IMPORT_DATABASE_URL }}
          # Stage 1 discovery. Server-side only; never printed.
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          # Legacy Google discovery runs only (new runs use DataForSEO).
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # ChatGPT (OpenAI): web research for the remaining gaps and, by default, the writer. Server-side only.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMPORT_OPENAI_MODEL: ${{ vars.IMPORT_OPENAI_MODEL }}
          # Claude as the alternative writer (llmProvider setting) and the optional extraction step. Server-side only.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IMPORT_MODEL: ${{ vars.IMPORT_MODEL }}
          IMPORT_EDITORIAL_MODEL: ${{ vars.IMPORT_EDITORIAL_MODEL }}
          # Apify actors for the gaps the site leaves (Google Maps, Facebook, Instagram). Server-side only.
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # Optional YouTube Data API key (video validation and channel discovery); without it oEmbed validates videos found on the site.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Image storage for listings enhanced by the worker (same store the site uses).
          # After automatic publication the worker asks the site to refresh its cached pages (optional).
          SITE_URL: ${{ vars.SITE_URL || 'https://beautyfind.co.il' }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          STORAGE_ADAPTER: ${{ secrets.BLOB_READ_WRITE_TOKEN != '' && 'blob' || 'none' }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          # Optional versioned price override (JSON), see src/lib/import/pricing.ts.
          IMPORT_PRICING_JSON: ${{ vars.IMPORT_PRICING_JSON }}
      - name: Continue in a new job
        if: steps.work.outputs.more == 'true'
        run: gh workflow run import.yml --ref "${{ github.ref_name }}" -f run_id="${{ inputs.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}

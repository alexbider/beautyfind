# One-off data cleanups for the directory, run by hand from the Actions tab (or workflow_dispatch through
# the GitHub API) against the production database, which only this workflow's secrets can reach. Every task
# is a dry run unless "confirm" is ticked; the CSV it writes and the full log are uploaded as an artifact
# for review, and also committed to the "seo-reports" branch (runs/<run id>-<task>-<mode>/), which any clone
# can fetch when the artifact store is out of reach. Tasks: category-audit (primary category per listing),
# description-cleanup (queue rewrites of descriptions that break the text rules), treatment-hygiene
# (staff CSV; with confirm it hides sentence and article-title records, reversible with undo_run),
# city-category-report, import-settings (show, or change one key with setting=key=value and confirm).
name: SEO data cleanup

on:
  workflow_dispatch:
    inputs:
      task:
        description: Which cleanup to run
        required: true
        type: choice
        options: [category-audit, description-cleanup, treatment-hygiene, city-category-report, import-settings, editorial-report]
      confirm:
        description: Apply changes (off = dry run, CSV only)
        required: false
        type: boolean
        default: false
      actor:
        description: Staff user id recorded on queued runs (description-cleanup only; empty = the first ops user)
        required: false
        default: ''
      undo_run:
        description: treatment-hygiene only. Run id of an earlier applied run whose hidden records should be published again (ignores confirm)
        required: false
        default: ''
      setting:
        description: import-settings only. key=value to change (for example llmProvider=anthropic); empty = show the settings
        required: false
        default: ''
      run_id:
        description: editorial-report only. Import run id whose drafts to report
        required: false
        default: ''

concurrency:
  group: import-worker
  cancel-in-progress: false

permissions:
  contents: write # the report branch; the app branches are never touched

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: ${{ secrets.IMPORT_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.IMPORT_DATABASE_URL }}
      TASK: ${{ inputs.task }}
      CONFIRM: ${{ inputs.confirm }}
      ACTOR: ${{ inputs.actor }}
      UNDO_RUN: ${{ inputs.undo_run }}
      SETTING: ${{ inputs.setting }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Run the task
        run: |
          set -o pipefail
          mkdir -p reports
          flag=""; [ "$CONFIRM" = "true" ] && flag="--confirm"
          case "$TASK" in
            category-audit) npm run -s import:category-audit -- --out reports/category-audit.csv $flag 2>&1 | tee reports/log.txt ;;
            description-cleanup) npm run -s import:description-cleanup -- --out reports/description-cleanup.csv $flag ${ACTOR:+--actor "$ACTOR"} 2>&1 | tee reports/log.txt ;;
            treatment-hygiene)
              if [ -n "$UNDO_RUN" ]; then
                # The undo list lives on the report branch, in the folder of the run that hid the records.
                git fetch --quiet origin seo-reports
                git show "origin/seo-reports:runs/${UNDO_RUN}-treatment-hygiene-applied/treatment-hygiene-unpublished.csv" > reports/undo-source.csv
                npm run -s import:treatment-hygiene -- --republish reports/undo-source.csv 2>&1 | tee reports/log.txt
              else
                npm run -s import:treatment-hygiene -- --out reports/treatment-hygiene.csv --undo-out reports/treatment-hygiene-unpublished.csv $flag 2>&1 | tee reports/log.txt
              fi ;;
            city-category-report) npm run -s seo:city-category-report 2>&1 | tee reports/log.txt ;;
            editorial-report) npm run -s import:editorial-report -- --run "$RUN_ID" --out reports/editorial-report.csv 2>&1 | tee reports/log.txt ;;
            import-settings)
              # Shows the import settings; with "setting" (key=value) and confirm it changes that one key.
              if [ -n "$SETTING" ] && [ "$CONFIRM" = "true" ]; then
                npm run -s import:settings -- --set "$SETTING" 2>&1 | tee reports/log.txt
              else
                npm run -s import:settings 2>&1 | tee reports/log.txt
              fi ;;
          esac
          echo "::notice title=$TASK ($([ "$CONFIRM" = "true" ] && echo applied || echo dry run))::$(tail -1 reports/log.txt)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.task }}-${{ inputs.confirm && 'applied' || 'dry-run' }}
          path: web/reports/
          retention-days: 30
      - name: Commit the report to the seo-reports branch
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -e
          mode=$([ "$CONFIRM" = "true" ] && echo applied || echo dry-run); [ -n "$UNDO_RUN" ] && mode="undo-${UNDO_RUN}"
          dest="runs/${RUN_ID}-${TASK}-${mode}"
          tmp=$(mktemp -d)
          url="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if ! git clone --quiet --depth 1 --branch seo-reports "$url" "$tmp" 2>/dev/null; then
            git init --quiet -b seo-reports "$tmp"
            git -C "$tmp" remote add origin "$url"
            printf '# SEO data cleanup reports\n\nOne folder per workflow run: runs/<run id>-<task>-<dry-run|applied>/ holds the CSV and the log.\n' > "$tmp/README.md"
          fi
          mkdir -p "$tmp/$dest"
          cp -r reports/. "$tmp/$dest/"
          git -C "$tmp" config user.name github-actions
          git -C "$tmp" config user.email github-actions@users.noreply.github.com
          git -C "$tmp" add -A
          git -C "$tmp" commit --quiet -m "$TASK ($mode), run $RUN_ID" || { echo "nothing to commit"; exit 0; }
          git -C "$tmp" push --quiet origin seo-reports
          echo "report committed to seo-reports:$dest"

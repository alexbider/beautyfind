<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="description" content="באנר הסכמה לקובצי Cookie ב־BeautyFind — הכרחיים בלבד כברירת מחדל, בחירה מפורטת לפי קטגוריה.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&family=Frank+Ruhl+Libre:wght@400;500;700&family=Jost:wght@300&display=swap">
<style>
  html,body{margin:0;padding:0}
  *{box-sizing:border-box}
  a{color:#0B7A87}
  a:hover{color:#0C243E}
  @keyframes ckUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes ckFade{from{opacity:0}to{opacity:1}}
</style>
</helmet>

<div dir="rtl" lang="he" style="position:relative;font-family:Assistant,system-ui,sans-serif;color:#0C243E;line-height:1.55">

  <sc-if value="{{ showDemo }}" hint-placeholder-val="{{ true }}">
  <div aria-hidden="true" style="min-height:100vh;background:#F6F8F9;overflow-x:clip"><div style="max-width:1100px;margin:0 auto;padding:22px;opacity:.55">
    <div style="height:44px;border-radius:12px;background:#fff;border:1px solid #E6E6E6;margin-bottom:22px"></div>
    <div style="height:clamp(160px,26vw,300px);border-radius:20px;background:#E8F4F6;margin-bottom:18px"></div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px">
      <div style="height:150px;border-radius:16px;background:#fff;border:1px solid #E6E6E6"></div>
      <div style="height:150px;border-radius:16px;background:#fff;border:1px solid #E6E6E6"></div>
      <div style="height:150px;border-radius:16px;background:#fff;border:1px solid #E6E6E6"></div>
    </div>
  </div></div>
  </sc-if>

  <sc-if value="{{ showBanner }}" hint-placeholder-val="{{ true }}">
    <section role="region" aria-labelledby="ck-h" style="position:fixed;z-index:50;bottom:{{ pos.bottom }};right:{{ pos.side }};left:{{ pos.left }};max-width:{{ pos.max }};margin:0 auto;background:#fff;border:1px solid #E6E6E6;border-radius:18px;box-shadow:0 18px 50px rgba(12,36,62,.18);padding:clamp(16px,2vw,22px);animation:ckUp .28s cubic-bezier(.2,.7,.2,1) both">
      <div style="display:flex;gap:clamp(12px,2vw,24px);align-items:center;flex-wrap:wrap">
        <div style="flex:1 1 320px;min-width:0">
          <h2 id="ck-h" style="margin:0 0 4px;font-size:16.5px;font-weight:700">קובצי Cookie באתר</h2>
          <p style="margin:0;font-size:14px;color:#3E4F62;text-wrap:pretty">אנחנו משתמשים בקבצים הכרחיים כדי לזכור אזור וסינון, ובקבצי מדידה מצטברת — רק אם תאשרו. איננו משתמשים במידע לפרסום מותאם. <a href="./BeautyFind Legal.dc.html">מדיניות הפרטיות</a></p>
        </div>
        <div style="flex:none;display:flex;gap:8px;flex-wrap:wrap">
          <button type="button" onClick="{{ acceptAll }}" style="min-height:46px;padding:0 17px;border:0;border-radius:12px;background:#0B7A87;font:inherit;font-size:15px;font-weight:700;color:#fff;cursor:pointer" style-hover="background:#0C243E">אישור הכל</button>
          <button type="button" onClick="{{ essentialOnly }}" style="min-height:46px;padding:0 15px;border:1px solid #0B7A87;border-radius:12px;background:#fff;font:inherit;font-size:15px;font-weight:700;color:#0B7A87;cursor:pointer">הכרחיים בלבד</button>
          <button type="button" onClick="{{ openPrefs }}" style="min-height:46px;padding:0 13px;border:0;border-radius:12px;background:transparent;font:inherit;font-size:14.5px;font-weight:700;color:#5B6B7B;cursor:pointer;text-decoration:underline">בחירה מפורטת</button>
        </div>
      </div>
    </section>
  </sc-if>

  <sc-if value="{{ showPrefs }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:60;background:rgba(12,36,62,.42);display:flex;align-items:center;justify-content:center;padding:16px;animation:ckFade .18s ease both">
      <section role="dialog" aria-modal="true" aria-labelledby="ck-ph" style="width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:20px;box-shadow:0 24px 60px rgba(12,36,62,.28);animation:ckUp .22s ease both">
        <div style="padding:18px 20px 4px;display:flex;align-items:flex-start;gap:10px">
          <h2 id="ck-ph" style="flex:1;min-width:0;margin:0;font-family:'Frank Ruhl Libre',serif;font-size:24px;font-weight:500;letter-spacing:-0.012em">העדפות Cookie</h2>
          <button type="button" aria-label="סגירה" onClick="{{ closePrefs }}" style="flex:none;width:40px;height:40px;border:0;border-radius:10px;background:#F6F8F9;font:inherit;font-size:20px;color:#5B6B7B;cursor:pointer">×</button>
        </div>
        <ul style="list-style:none;margin:0;padding:8px 20px">
          <sc-for list="{{ cats }}" as="c" hint-placeholder-count="3"><li style="padding:14px 0;border-bottom:1px solid #EDEFF2;display:flex;align-items:flex-start;gap:14px"><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:700">{{ c.name }}</span><span style="font-size:13px;color:#5B6B7B;text-wrap:pretty">{{ c.note }}</span></span><button type="button" role="switch" aria-checked="{{ c.on }}" aria-label="{{ c.name }}" onClick="{{ c.toggle }}" disabled="{{ c.locked }}" style="flex:none;position:relative;width:48px;height:28px;margin-top:2px;border:0;border-radius:14px;background:{{ c.track }};cursor:pointer;opacity:{{ c.op }};padding:0"><span aria-hidden="true" style="position:absolute;top:3px;right:{{ c.knob }};width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(12,36,62,.25);transition:right .16s"></span></button></li></sc-for>
        </ul>
        <div style="padding:14px 20px 20px;display:flex;gap:8px;flex-wrap:wrap">
          <button type="button" onClick="{{ savePrefs }}" style="flex:1;min-width:160px;min-height:48px;padding:0 16px;border:0;border-radius:12px;background:#0B7A87;font:inherit;font-size:15.5px;font-weight:700;color:#fff;cursor:pointer">שמירת הבחירה</button>
          <button type="button" onClick="{{ acceptAll }}" style="flex:none;min-height:48px;padding:0 15px;border:1px solid #E6E6E6;border-radius:12px;background:#fff;font:inherit;font-size:15px;font-weight:600;color:#3E4F62;cursor:pointer">אישור הכל</button>
        </div>
      </section>
    </div>
  </sc-if>

  <sc-if value="{{ decided }}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{ openPrefs }}" style="position:fixed;z-index:40;bottom:16px;right:16px;min-height:42px;padding:0 14px;border:1px solid #E6E6E6;border-radius:21px;background:#fff;box-shadow:0 6px 18px rgba(12,36,62,.12);font:inherit;font-size:13.5px;font-weight:700;color:#3E4F62;cursor:pointer;animation:ckFade .2s ease both">{{ decidedLabel }} · שינוי</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:720},&quot;embedded&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bar&quot;,&quot;card&quot;],&quot;default&quot;:&quot;bar&quot;,&quot;tsType&quot;:&quot;'bar'|'card'&quot;}}">
const KEY = 'bf-cookie-consent';
const CATS = [
  ['essential', 'הכרחיים', 'אזור, סינון שמור, כניסה לחשבון ואבטחה. בלעדיהם האתר לא עובד.', true],
  ['analytics', 'מדידה מצטברת', 'אילו עמודים נקראים ואיפה החיפוש נתקע — ללא זיהוי אישי.', false],
  ['embeds', 'תוכן מוטמע', 'מפות, סרטוני הקליניקות ווידג׳טים של ביקורות מגוגל.', false]
];

class Component extends DCLogic {
  constructor(p) {
    super(p);
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
    this.state = { saved, prefs: false, draft: saved ? Object.assign({}, saved) : { essential: true, analytics: false, embeds: false } };
  }
  save(v) {
    try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {}
    this.setState({ saved: v, draft: Object.assign({}, v), prefs: false });
  }
  renderVals() {
    const s = this.state;
    const bar = (this.props.layout || 'bar') === 'bar';
    const n = s.saved ? CATS.filter(c => s.saved[c[0]]).length : 0;
    return {
      pos: bar ? { bottom: '16px', side: '16px', left: '16px', max: '1100px' } : { bottom: '16px', side: '16px', left: 'auto', max: '420px' },
      showDemo: !this.props.embedded,
      showBanner: !s.saved && !s.prefs,
      showPrefs: s.prefs,
      decided: !!s.saved && !s.prefs,
      decidedLabel: n === CATS.length ? 'כל ה־Cookie מאושרים' : n === 1 ? 'הכרחיים בלבד' : 'בחירה מותאמת',
      acceptAll: () => this.save({ essential: true, analytics: true, embeds: true }),
      essentialOnly: () => this.save({ essential: true, analytics: false, embeds: false }),
      openPrefs: () => this.setState({ prefs: true }),
      closePrefs: () => this.setState({ prefs: false }),
      savePrefs: () => this.save(s.draft),
      cats: CATS.map(c => {
        const on = c[3] || !!s.draft[c[0]];
        return { name: c[1], note: c[2], on: on ? 'true' : 'false', locked: c[3], op: c[3] ? '.55' : '1',
          track: on ? '#0B7A87' : '#C9CFD6', knob: on ? '23px' : '3px',
          toggle: () => { if (!c[3]) this.setState(st => ({ draft: Object.assign({}, st.draft, { [c[0]]: !st.draft[c[0]] }) })); } };
      })
    };
  }
}
</script>
</body>
</html>
